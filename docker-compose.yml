# =============================================================================
#  遇你 · culture —— 一键本地/测试环境（Docker Compose）
#
#  为什么需要它：本项目原本依赖「本机装 MySQL 5.7 + Redis + JDK17 + Maven」，
#  换机器/重装/沙箱回收进程后经常起不来（本次开发中就遇到过 MySQL、Redis、后端
#  被反复回收）。用 compose 一条命令拉起全套，环境可复现。
#
#  用法：
#    cp .env.example .env      # 按需改密码/端口
#    docker compose up -d      # 启动 mysql + redis + backend + web(nginx)
#    docker compose logs -f backend
#    docker compose down       # 停止（数据保留在 named volume；加 -v 会删数据）
#
#  说明：
#    · MySQL 固定 5.7（项目用了 5.7 的语法与 ngram 分词；8.0 需要额外回归）。
#    · 首次启动会自动执行 docs/sql/*.sql（按文件名顺序），即建表 + 索引 + 菜单权限。
#    · backend 镜像在容器内构建（多阶段：maven 构建 → JRE 运行），需要能访问
#      Maven 中央仓库；离线环境请改成「本机 mvn package 后挂载 jar」的方式。
#    · 上传目录与备份目录挂载到宿主机，便于备份/迁移。
# =============================================================================

services:
  mysql:
    image: mysql:5.7
    container_name: culture-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
      - --ngram_token_size=2          # 中文全文检索（搜索增强依赖）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-culture_v2}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # docs/sql/*.sql 会在数据目录为空的首次启动时按顺序执行
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:6-alpine
    container_name: culture-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culture-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-culture_v2}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      # 站点域名（sitemap/robots/rss 与 og:image 用绝对地址）
      APP_SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8080}
      # 上传目录（容器内路径，挂载到宿主机）
      AVATAR_UPLOAD_PATH: /data/upload/avatar
      CULTURE_UPLOAD_PATH: /data/upload/culture
      EDITOR_UPLOAD_PATH: /data/upload/media
      # 前台公共列表（分类/标签）的 Redis 读缓存与慢 SQL 上报（不配则用 application.yml 默认值）
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CACHE_TTL_SECONDS: ${APP_CACHE_TTL_SECONDS:-60}
      APP_SLOW_SQL_ENABLED: ${APP_SLOW_SQL_ENABLED:-true}
      APP_SLOW_SQL_THRESHOLD_MS: ${APP_SLOW_SQL_THRESHOLD_MS:-500}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      # 运行时上传数据：avatar / culture / media（目录结构整理后统一收敛到项目根 upload/）
      - ./upload:/data/upload
      - ./backups:/data/backups                        # 备份脚本输出
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: nginx:1.25-alpine
    container_name: culture-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 前端构建产物（本机先执行 cd web && npm run build:all）
      # 前端已自包含：dist/ 里含 index/ 与 static/ 老设计资源，无需后端参与
      - ./web/dist:/usr/share/nginx/html:ro
      # Docker 专用配置（root 指向上面的挂载点，后端地址用服务名 backend:8081）。
      # 注意不要用 deploy/nginx.conf.example —— 那份是裸机版：
      #   root 是 /var/www/culture/dist、后端是 127.0.0.1:8081，
      #   在容器里会导致静态 404 且所有接口反代失败。
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
