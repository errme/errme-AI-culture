# =============================================================================
#  CI：构建 + 静态检查 + 前后端单测 + 端到端回归
#
#  本地等价命令：bash scripts/ci.sh
#  说明：端到端回归需要「后端 8081 + 前端预览 8080」在跑，因此 CI 里用 compose 起环境；
#       若你的 CI 不方便跑 Docker，可只保留 build / check / unit 三段。
# =============================================================================
name: ci

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 前端依赖与构建（含预渲染）
        working-directory: web
        run: |
          npm ci || npm install
          npm run build:all

      - name: 入口 HTML 检查（禁止 head 静态引入 core-js）
        working-directory: web
        run: npm run check:entries

      - name: 前端单元测试（node:test，无额外依赖）
        working-directory: web
        run: npm test

      - name: 后端构建 + 零依赖自测
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq default-jdk maven
          cd backend
          mvn -q -DskipTests package
          mvn -q -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          javac -encoding UTF-8 -d target/test-classes -cp "target/classes:$(cat target/cp.txt)" src/test/java/com/culture/SelfTest.java
          java -Dfile.encoding=UTF-8 -cp "target/classes:target/test-classes:$(cat target/cp.txt)" com.culture.SelfTest

      - name: 启动依赖并跑端到端回归
        run: |
          docker compose up -d mysql redis
          # 等 MySQL 就绪
          for i in $(seq 1 60); do docker compose exec -T mysql mysqladmin ping -h127.0.0.1 -p123456 && break || sleep 3; done
          docker compose up -d backend
          for i in $(seq 1 60); do curl -sf http://localhost:8081/api/health && break || sleep 3; done
          cd web && PORT=8080 node tools/serve-dist.mjs > /tmp/serve.log 2>&1 &
          sleep 3
          node tools/verify.mjs http://localhost:8080

      - name: 收集日志（失败时）
        if: failure()
        run: docker compose logs --tail=200
